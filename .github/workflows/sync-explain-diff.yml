name: Sync Explain Diff upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror official Gist
        run: bash scripts/sync-explain-diff-gist.sh
      - name: Validate mirrored skills
        run: npx skills add . --list --full-depth
      - name: Commit mirrored skills
        run: |
          if git diff --quiet; then
            echo "Explain Diff is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/explain-diff-html/SKILL.md \
            skills/explain-diff-notion/SKILL.md
          git commit -m "chore(explain-diff): sync upstream gist"
          git push
